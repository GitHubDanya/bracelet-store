version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: bracelet_postgres
    environment:
      POSTGRES_DB: bracelet_db
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
